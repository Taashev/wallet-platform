volumes:
  wallet_platform_postgres_data:
  wallet_platform_minio_data:

services:
  wallet_platform_minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: wallet_platform_minio
    environment:
      MINIO_BUCKET: $MINIO_BUCKET
      MINIO_ENDPOINT: $MINIO_ENDPOINT
      MINIO_ROOT_USER: $MINIO_ROOT_USER
      MINIO_ROOT_PASSWORD: $MINIO_ROOT_PASSWORD
    ports:
      - $MINIO_PORT_API:9000
      - $MINIO_PORT_CLIENT:9001
    volumes:
      - wallet_platform_minio_data:/data
    command: server /data --console-address ":9001"

  wallet_platform_postgres:
    image: postgres:16
    container_name: wallet_platform_postgres
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    ports:
      - $POSTGRES_PORT:5432
    volumes:
      - wallet_platform_postgres_data:/var/lib/postgresql/data
