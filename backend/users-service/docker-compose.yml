volumes:
  wallet_platform_postgres:

services:
  wallet_platform_postgres:
    image: postgres:16
    container_name: wallet_platform_postgres
    environment:
      POSTGRES_DB: $POSTGRES_DB
      POSTGRES_USER: $POSTGRES_USER
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    ports:
      - $POSTGRES_PORT:5432
    volumes:
      - wallet_platform_postgres:/var/lib/postgresql/data
